spring.application.name=api-gateway
server.port=8080

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Enable automatic routing via Eureka
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true


# ===============================
# AUTH SERVICE
# ===============================
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# ===============================
# JOB SERVICE
# ===============================
spring.cloud.gateway.routes[1].id=job-service
spring.cloud.gateway.routes[1].uri=lb://JOB-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobs/**

# ===============================
# PROFILE SERVICE
# ===============================
spring.cloud.gateway.routes[2].id=profile-service
spring.cloud.gateway.routes[2].uri=lb://PROFILE-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/profiles/**

# ===============================
# APPLICATION SERVICE
# ===============================
spring.cloud.gateway.routes[3].id=application-service
spring.cloud.gateway.routes[3].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/applications/**

# ===============================
# INTERVIEW SERVICE
# ===============================
spring.cloud.gateway.routes[4].id=interview-service
spring.cloud.gateway.routes[4].uri=lb://INTERVIEW-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/interviews/**

# ===============================
# NOTIFICATION SERVICE
# ===============================
spring.cloud.gateway.routes[5].id=notification-service
spring.cloud.gateway.routes[5].uri=lb://NOTIFICATION-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/notifications/**

# ===============================
# SUBSCRIPTION SERVICE
# ===============================
spring.cloud.gateway.routes[6].id=subscription-service
spring.cloud.gateway.routes[6].uri=lb://SUBSCRIPTION-SERVICE
spring.cloud.gateway.routes[6].predicates[0]=Path=/subscriptions/**

# ===============================
# ANALYTICS SERVICE
# ===============================
spring.cloud.gateway.routes[7].id=analytics-service
spring.cloud.gateway.routes[7].uri=lb://ANALYTICS-SERVICE
spring.cloud.gateway.routes[7].predicates[0]=Path=/analytics/**

# ===============================
# ADMIN ROUTES (served by auth-service)
# ===============================
spring.cloud.gateway.routes[8].id=admin-service
spring.cloud.gateway.routes[8].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[8].predicates[0]=Path=/admin/**

# ===============================
# SWAGGER ROUTES
# ===============================
spring.cloud.gateway.routes[9].id=swagger-auth
spring.cloud.gateway.routes[9].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[9].predicates[0]=Path=/swagger-docs/auth-service/**
spring.cloud.gateway.routes[9].filters[0]=RewritePath=/swagger-docs/auth-service/(?<segment>.*), /$\\{segment}
spring.cloud.gateway.routes[9].filters[1]=RemoveRequestHeader=X-Forwarded-Prefix
spring.cloud.gateway.routes[9].filters[2]=RemoveRequestHeader=Forwarded

spring.cloud.gateway.routes[10].id=swagger-job

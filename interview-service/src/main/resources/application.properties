spring.application.name=interview-service
# Server Port
server.port=8085

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hireconnect_db
spring.datasource.username=root
spring.datasource.password=ckjain1166

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=interview_schema
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional (Good for debugging)
spring.jpa.properties.hibernate.format_sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.fail-on-unknown-properties=false

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
# Bug 8 fix: JWT secret moved out of source code
jwt.secret=mysecretkeymysecretkeymysecretkey123456


# Swagger / SpringDoc OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operationsSorter=method

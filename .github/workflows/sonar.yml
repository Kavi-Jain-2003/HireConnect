name: SonarCloud Analysis

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - main

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Analyze auth-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd auth-service && chmod +x mvnw
          ./mvnw clean install -DskipTests sonar:sonar \
            -Dsonar.projectKey=Kavi-Jain-2003_HireConnect \
            -Dsonar.organization=kavi-jain-2003 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectName="HireConnect - Auth Service" \
            -Dsonar.java.binaries=target/classes

      - name: Analyze job-service
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          cd job-service && chmod +x mvnw
          ./mvnw clean install -DskipTests sonar:sonar \
            -Dsonar.projectKey=Kavi-Jain-2003_HireConnect \

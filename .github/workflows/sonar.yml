name: SonarCloud Analysis

on:
  push:
    branches:
      - dev
      - main

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # needed for blame & new-code detection

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and Analyze all services
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn clean install -DskipTests sonar:sonar \
            -Dsonar.projectKey=Kavi-Jain-2003_HireConnect \
            -Dsonar.organization=kavi-jain-2003 \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.projectName="HireConnect"

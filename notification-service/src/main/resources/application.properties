# Server port
server.port=8086

# Application name
spring.application.name=notification-service

# MySQL Configuration (adjust if you are using different DB)
spring.datasource.url=jdbc:mysql://localhost:3306/hireconnect_db
spring.datasource.username=root
spring.datasource.password=ckjain1166

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=notification_schema


spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Settings
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# Optional (good for consistent timestamps)
#spring.jackson.serialization.write-dates-as-timestamps=false

# ── SMTP Email (Gmail) ──────────────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=REPLACE_WITH_YOUR_GMAIL@gmail.com
spring.mail.password=REPLACE_WITH_YOUR_APP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
